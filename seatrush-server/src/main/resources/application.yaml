spring:
  application:
    name: seatrush
  datasource:
    # 只用于本地开发：关闭 SSL，允许获取公钥，避免 MySQL 8 常见的连接报错
    url: jdbc:mysql://localhost:3306/seatrush?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: seatrush
    password: seatrush
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
