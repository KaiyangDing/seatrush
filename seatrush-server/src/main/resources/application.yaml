spring:
  application:
    name: seatrush
  datasource:
    # 只用于本地开发：关闭 SSL，允许获取公钥，避免 MySQL 8 常见的连接报错
    url: jdbc:mysql://localhost:3306/seatrush?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: seatrush
    password: seatrush
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  tomcat:
    # A rush opens hundreds of connections in the same instant. With the default backlog of 100 the
    # operating system refuses the rest before Tomcat even sees them (found by the load test).
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

seatrush:
  holds:
    duration: 5m
  lock:
    # Which seat lock strategy new holds use: pessimistic, optimistic, in-memory or redis.
    # Admins can switch it while the application runs: PUT /api/admin/lock-strategy
    strategy: pessimistic
    # How long a request waits for a seat lock before it gives up with 409
    wait-timeout: 5s
    # How long a Redis seat lock lives if its owner crashes before releasing it
    redis-lease: 10s
  security:
    # Local development defaults only. Override with environment variables outside your machine.
    jwt-secret: ${SEATRUSH_JWT_SECRET:local-dev-jwt-secret-change-me-0123456789}
    pepper: ${SEATRUSH_PEPPER:local-dev-pepper-change-me}
    token-ttl: 2h
    admin-username: ${SEATRUSH_ADMIN_USERNAME:admin}
    admin-password: ${SEATRUSH_ADMIN_PASSWORD:admin12345}
